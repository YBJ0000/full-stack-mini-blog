version: '3.8'
services:
  mini-blog-server:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data: